<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECONnections</title>
<style>
:root{--bg:#fcfbf9;--fg:#1a1a1a;--card:#fff;--line:#e3e3e0;--tile:#efeee8;--muted:#777;--sel:#5a594e}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--card:#222;--line:#3a3a3a;--tile:#2e2e2b;--muted:#999;--sel:#8a897c}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);user-select:none}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;text-align:center}
header h1{margin:0;font-size:22px;font-weight:900;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px}
.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}
select{padding:6px 10px;border-radius:10px;border:1px solid var(--line);font-size:13px;background:var(--card);color:var(--fg)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.card:hover{border-color:#d4a017}.card h3{margin:6px 0 2px;font-size:16px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;background:#fdecb4;color:#7a5a00;padding:2px 9px;border-radius:99px}
.tag.ok{background:#d8f0d8;color:#1d6b1d;margin-left:6px}.tag.try{background:#e8e8e8;color:#555;margin-left:6px}
.link{background:none;border:0;font-weight:700;font-size:13px;cursor:pointer;color:var(--fg);padding:0;font-family:inherit}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tile{aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;background:var(--tile);font-weight:700;font-size:13px;padding:4px;cursor:pointer;color:var(--fg);font-family:inherit;overflow-wrap:anywhere}
.tile[aria-pressed=true]{background:var(--sel);color:#fff;border-color:var(--sel)}
.shake .tile{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.solved{border-radius:10px;padding:10px;text-align:center;margin-bottom:8px}
.solved b{display:block;font-size:13px;text-transform:uppercase}.solved span{font-size:13px}
.solved i{display:block;font-size:12px;opacity:.85;margin-top:4px}
.c0{background:#f9df6d;color:#000}.c1{background:#a0c35a;color:#000}.c2{background:#b0c4ef;color:#000}.c3{background:#ba81c5;color:#fff}
.missed{outline:2px dashed #c33;outline-offset:-2px}
.btns{display:flex;justify-content:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:99px;border:1px solid #888;background:var(--card);color:var(--fg);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.btn.go{background:var(--fg);color:var(--bg);border-color:var(--fg)}.btn:disabled{opacity:.35;cursor:not-allowed}
.dots{display:flex;justify-content:center;align-items:center;gap:6px;font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--fg)}.dot.off{opacity:.2;transform:scale(.7)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:9}
#end{margin-top:16px;text-align:center}#end pre{font:inherit;font-size:18px;line-height:1.3;margin:8px 0}
footer{text-align:center;font-size:12px;color:var(--muted);padding:16px}
</style>
</head>
<body>
<header><h1 id="home">ECONnections</h1></header>
<main>
  <section id="archive">
    <div class="bar">
      <div><b>Puzzles</b><div class="muted" id="count"></div></div>
      <select id="filter" aria-label="Filter by topic"></select>
    </div>
    <div id="list"></div>
    <p class="muted" style="text-align:center"><button class="link" id="reset">Reset my progress</button></p>
  </section>
  <section id="game" class="hidden">
    <div class="bar"><button class="link" id="back">← All puzzles</button><span class="tag" id="meta"></span></div>
    <h2 id="title" style="text-align:center;margin:4px 0;font-size:20px"></h2>
    <p class="muted" style="text-align:center;margin:0">Create four groups of four!</p>
    <div id="solved" style="margin-top:10px"></div>
    <div id="grid"></div>
    <div class="dots"><span>Mistakes remaining:</span><span id="dots" style="display:flex;gap:5px"></span></div>
    <div class="btns" id="ctrl">
      <button class="btn" id="shuffle">Shuffle</button>
      <button class="btn" id="deselect">Deselect All</button>
      <button class="btn go" id="submit" disabled>Submit</button>
    </div>
    <div id="end" class="hidden">
      <p id="endmsg" style="font-weight:700;margin:0"></p>
      <pre id="emoji"></pre>
      <div class="btns">
        <button class="btn" id="share">Copy result</button>
        <button class="btn" id="again">Play again</button>
        <button class="btn go" id="toarchive">All puzzles</button>
      </div>
    </div>
  </section>
</main>
<footer>ECONnections — Economics concept puzzles</footer>
<div id="toast" class="hidden"></div>
<script src="puzzles.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SQ=['🟨','🟩','🟦','🟪'];
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let progress=LS.get('econ_progress',{});
const okPuzzle=p=>p&&p.categories&&p.categories.length===4&&p.categories.every(c=>c.items&&c.items.length===4);
const puzzles=(window.PUZZLES||[]).filter(p=>{if(!okPuzzle(p))console.warn('Skipped invalid puzzle',p&&p.id);return okPuzzle(p)});
let cur,tiles,sel,solved,missed,mistakes,locked,guesses;

function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),1800)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(v){$('archive').classList.toggle('hidden',v!=='archive');$('game').classList.toggle('hidden',v!=='game');if(v==='archive'){if(location.hash)history.replaceState(null,'',location.pathname+location.search);renderArchive()}}

function renderArchive(){
  const f=$('filter'),prev=f.value||'ALL';
  const topics=[...new Set(puzzles.map(p=>p.topic||'General'))].sort();
  f.innerHTML='<option value="ALL">All topics</option>'+topics.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
  f.value=topics.includes(prev)?prev:'ALL';
  const list=puzzles.filter(p=>f.value==='ALL'||(p.topic||'General')===f.value);
  const done=puzzles.filter(p=>progress[p.id]&&progress[p.id].won).length;
  $('count').textContent=`${done} of ${puzzles.length} solved`;
  $('list').innerHTML=list.length?'':'<p class="muted">No puzzles here yet.</p>';
  list.forEach(p=>{
    const pr=progress[p.id];
    const badge=pr?(pr.won?`<span class="tag ok">✓ Solved · ${pr.best} mistake${pr.best===1?'':'s'} left</span>`:'<span class="tag try">Attempted</span>'):'';
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<span class="tag">${esc(p.week||'Puzzle')}</span>${badge}<h3>${esc(p.title)}</h3><div class="muted">${esc(p.topic||'Economics')}</div>`;
    d.onclick=()=>start(p);$('list').appendChild(d);
  });
}

function start(p){
  cur=p;$('title').textContent=p.title;$('meta').textContent=[p.week,p.topic].filter(Boolean).join(' • ');
  solved=[];missed=[];sel=[];mistakes=4;locked=false;guesses=[];
  tiles=shuffle(p.categories.flatMap((c,ci)=>c.items.map((t,ti)=>({key:ci+'-'+ti,text:t,cat:ci}))));
  $('end').classList.add('hidden');$('ctrl').classList.remove('hidden');
  show('game');render();
}

function render(){
  $('solved').innerHTML=solved.map(ci=>{const c=cur.categories[ci];
    return `<div class="solved c${ci}${missed.includes(ci)?' missed':''}"><b>${esc(c.description)}${missed.includes(ci)?' (missed)':''}</b><span>${c.items.map(esc).join(' · ')}</span>${c.explanation?`<i>${esc(c.explanation)}</i>`:''}</div>`}).join('');
  $('grid').innerHTML='';
  tiles.forEach(t=>{const b=document.createElement('button');b.textContent=t.text;b.className='tile';b.setAttribute('aria-pressed',sel.includes(t.key));
    b.onclick=()=>{if(locked)return;const i=sel.indexOf(t.key);if(i>-1)sel.splice(i,1);else if(sel.length<4)sel.push(t.key);render()};$('grid').appendChild(b)});
  $('dots').innerHTML=[0,1,2,3].map(i=>`<span class="dot${i<mistakes?'':' off'}"></span>`).join('');
  $('submit').disabled=!(sel.length===4&&!locked);
}

function finish(won){
  progress[cur.id]={won:won||(progress[cur.id]&&progress[cur.id].won)||false,best:Math.max(won?mistakes:0,(progress[cur.id]&&progress[cur.id].best)||0)};
  LS.set('econ_progress',progress);
  $('endmsg').textContent=won?`Solved with ${mistakes} mistake${mistakes===1?'':'s'} to spare!`:'Not this time. Review the explanations above, then try again.';
  $('emoji').textContent=guesses.map(g=>g.map(c=>SQ[c]).join('')).join('\n');
  $('ctrl').classList.add('hidden');$('end').classList.remove('hidden');
}

function submit(){
  if(sel.length!==4||locked)return;
  const picked=tiles.filter(t=>sel.includes(t.key));
  const counts=[0,0,0,0];picked.forEach(t=>counts[t.cat]++);
  guesses.push(picked.map(t=>t.cat).sort());
  const hit=counts.indexOf(4);
  if(hit>-1){
    solved.push(hit);tiles=tiles.filter(t=>t.cat!==hit);sel=[];render();
    if(solved.length===4)finish(true);
  }else{
    mistakes--;if(counts.includes(3)&&mistakes>0)toast('One away!');
    locked=true;$('grid').classList.add('shake');
    setTimeout(()=>{$('grid').classList.remove('shake');locked=false;
      if(mistakes===0){[0,1,2,3].forEach(ci=>{if(!solved.includes(ci)){solved.push(ci);missed.push(ci)}});tiles=[];sel=[];render();finish(false)}
      else render()},450);
    render();
  }
}

$('submit').onclick=submit;
$('shuffle').onclick=()=>{if(!locked){tiles=shuffle(tiles);render()}};
$('deselect').onclick=()=>{if(!locked){sel=[];render()}};
$('back').onclick=$('toarchive').onclick=$('home').onclick=()=>show('archive');
$('again').onclick=()=>start(cur);
$('filter').onchange=renderArchive;
$('reset').onclick=()=>{if(confirm('Clear your solved puzzles on this device?')){progress={};LS.set('econ_progress',progress);renderArchive()}};
$('share').onclick=async()=>{
  const txt=`ECONnections: ${cur.title}\n${$('emoji').textContent}`;
  try{await navigator.clipboard.writeText(txt);toast('Copied!')}catch(e){prompt('Copy your result:',txt)}
};

/* Shared puzzle link: index.html#p=<encoded puzzle> (made by builder.html) */
function fromHash(){
  if(!location.hash.startsWith('#p='))return false;
  try{
    const [title,week,topic,cats]=JSON.parse(decodeURIComponent(location.hash.slice(3)));
    const p={id:'shared-'+title,week,topic,title,categories:cats.map(c=>({description:c[0],explanation:c[1],items:c.slice(2,6)}))};
    if(okPuzzle(p)){start(p);return true}
  }catch(e){console.warn('Bad puzzle link',e)}
  return false;
}
window.addEventListener('hashchange',fromHash);
if(!fromHash())show('archive');
</script>
</body>
</html>
