<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECONnections Puzzle Builder</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fcfbf9;color:#1a1a1a}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}.muted{color:#666;font-size:13px}
input,textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;font:inherit;font-size:14px;background:#fff}
.row{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-bottom:8px}
fieldset{border:0;border-radius:12px;padding:12px;margin:12px 0}
legend{display:none}.cat h3{margin:0 0 8px;font-size:14px}
.cat input{margin-bottom:6px}.items{display:grid;grid-template-columns:1fr 1fr;gap:6px}.items input{margin:0}
.c0{background:#f9df6d}.c1{background:#a0c35a}.c2{background:#b0c4ef}.c3{background:#ba81c5;color:#fff}
button{padding:10px 18px;border-radius:99px;border:0;background:#111;color:#fff;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
button.alt{background:#e5e5e5;color:#111}
#out{margin-top:16px}.err{background:#fde8e8;color:#8a1c1c;padding:10px 14px;border-radius:10px;font-size:14px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;height:220px}
a{color:#a15c00;font-weight:700}
</style>
</head>
<body>
<main>
<h1>ECONnections Puzzle Builder</h1>
<p class="muted">Fill in the form, then click Generate. You get (1) a link you can share straight away, and (2) a code block to add the puzzle to your permanent archive. Nothing is saved on this page.</p>
<form id="f" onsubmit="return false">
  <div class="row"><input id="week" placeholder="Week / Term (e.g. Week 3)"><input id="topic" placeholder="Topic (e.g. Elasticity)"></div>
  <input id="title" placeholder="Puzzle title" style="margin-bottom:8px">
  <div id="cats"></div>
  <button id="gen">Generate</button> <button type="button" class="alt" id="clear">Clear form</button>
</form>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const labels=['🟨 Yellow (easiest)','🟩 Green','🟦 Blue','🟪 Purple (trickiest)'];
$('cats').innerHTML=[0,1,2,3].map(i=>`<fieldset class="cat c${i}"><h3>${labels[i]}</h3>
 <input id="d${i}" placeholder="Category name (what the 4 items have in common)">
 <input id="e${i}" placeholder="Explanation shown to students (optional but recommended)">
 <div class="items">${[0,1,2,3].map(j=>`<input id="i${i}${j}" placeholder="Item ${j+1}">`).join('')}</div></fieldset>`).join('');
const v=id=>$(id).value.trim();
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

$('gen').onclick=()=>{
  const errs=[],cats=[],seen=new Map();
  const title=v('title'),week=v('week'),topic=v('topic');
  if(!title)errs.push('Add a puzzle title.');
  for(let i=0;i<4;i++){
    const items=[0,1,2,3].map(j=>v('i'+i+j));
    if(!v('d'+i))errs.push(`Category ${i+1} needs a name.`);
    items.forEach((t,j)=>{
      if(!t){errs.push(`Category ${i+1}, item ${j+1} is empty.`);return}
      const k=t.toLowerCase();
      if(seen.has(k))errs.push(`"${t}" appears twice (categories ${seen.get(k)} and ${i+1}). Each tile must be unique.`);
      seen.set(k,i+1);
    });
    cats.push({description:v('d'+i),explanation:v('e'+i),items});
  }
  const out=$('out');
  if(errs.length){out.innerHTML='<div class="err">'+errs.map(e=>'• '+esc(e)).join('<br>')+'</div>';return}
  const id=(title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30)||'puzzle')+'-'+Date.now().toString(36).slice(-4);
  const puzzle={id,week,topic,title,categories:cats};
  const code=JSON.stringify(puzzle,null,2).replace(/^/gm,'  ')+',';
  const packed=[title,week,topic,cats.map(c=>[c.description,c.explanation,...c.items])];
  const link=new URL('index.html',location.href).href.split('#')[0]+'#p='+encodeURIComponent(JSON.stringify(packed));
  out.innerHTML=`<h2 style="font-size:16px">1. Quick share link</h2>
   <p class="muted">Students open this and play immediately. It is not added to the archive.</p>
   <input id="lnk" readonly value="${esc(link).replace(/"/g,'&quot;')}">
   <p><button id="cl">Copy link</button> <a href="${esc(link).replace(/"/g,'&quot;')}" target="_blank" rel="noopener">Test it ↗</a></p>
   <h2 style="font-size:16px">2. Add to the permanent archive</h2>
   <p class="muted">Open <b>puzzles.js</b>, paste this just before the final <code>];</code>, and save.</p>
   <textarea id="code" readonly>${esc(code)}</textarea>
   <p><button id="cc">Copy code</button></p>`;
  $('cl').onclick=()=>copy('lnk');$('cc').onclick=()=>copy('code');
};
async function copy(id){const el=$(id);el.select();try{await navigator.clipboard.writeText(el.value);}catch(e){document.execCommand('copy')}}
$('clear').onclick=()=>{$('f').reset();$('out').innerHTML=''};
</script>
</body>
</html>
